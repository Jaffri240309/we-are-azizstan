<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ข่าวสาร | We Are Azizstan</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="announce" class="announce">
    <div class="container announce-inner">
      <div id="announceText"></div>
      <a id="announceLink" href="news.html">ดูรายละเอียด</a>
    </div>
  </div>

    <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <div class="brand-logos">
          <!-- Main School Logo -->
          <img src="assets/azizLogo.png" alt="Azizstan Logo" class="logo">
          <!-- DEPAZ Logo -->
          <img src="assets/depazLogo.jpg" alt="DEPAZ Logo" class="logo">
        </div>
        <div class="brand-txt">
          <div class="brand-title">We Are Azizstan</div>
          <div class="brand-sub">สภานักเรียน โรงเรียนมูลนิธิอาซิซสถาน</div>
        </div>
      </a>

      <nav class="nav">
        <a href="index.html"><i class="ph ph-house"></i> หน้าแรก</a>
        <a class="active" href="news.html"><i class="ph ph-newspaper"></i> ข่าวสาร</a>
        <a href="projects.html"><i class="ph ph-calendar-star"></i> กิจกรรม</a>
        <a href="forms.html"><i class="ph ph-clipboard-text"></i> แบบฟอร์ม</a>
        <a href="council.html"><i class="ph ph-users"></i> เกี่ยวกับสภา</a>
      </nav>

      <!-- Admin/Login button -->
      <a class="btn btn-primary btn-sm btn-login" href="admin/index.html">
        <i class="ph ph-user-circle"></i> แอดมิน
      </a>

      <button class="hamburger" id="menuBtn" aria-label="เปิดเมนู">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container page">
    <div class="section-head" style="align-items:center">
      <div>
        <h1>ข่าวสาร</h1>
        <p class="lead">ค้นหา/อ่านรายละเอียดข่าวได้ (อัปเดตจากไฟล์เดียว news.json)</p>
      </div>
      <input id="q" class="search" placeholder="ค้นหาข่าว เช่น ประกาศ, กิจกรรม, เว็บไซต์..." />
    </div>

    <div id="newsDetail" style="margin-bottom:14px;"></div>
    <div id="newsList" class="grid"></div>
  </main>

  <footer class="footer">
    <div class="container">อัปเดตข่าวโดยครูผู้ดูแลระบบและทีมสภานักเรียน</div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    // ถ้ามี ?id= จะโชว์รายละเอียดข่าวด้านบน
    SC.renderNewsDetail("#newsDetail");
    SC.renderNewsList("#newsList");

    document.getElementById("q").addEventListener("input", (e) => {
      SC.renderNewsList("#newsList", e.target.value);
    });
  </script>
</body>
</html>
